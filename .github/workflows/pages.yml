name: Build and deploy DLNM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dlnm-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DLNM_IMAGE_SOURCE: gremlin
      DLNM_ASSET_BASE_URL: https://henryd2341.github.io/dlnm/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release
      - name: Upload downloadable release
        uses: actions/upload-artifact@v7
        with:
          name: dlnm-gremlin
          path: artifacts/release/
          if-no-files-found: error
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/release/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
